name: Daily UFC Odds Scrape

on:
  schedule:
    - cron: '0 13 * * *'  # 9 AM EST (13:00 UTC)
  workflow_dispatch:
    inputs:
      event_url:
        description: 'UFC Event URL to scrape'
        required: false
        default: 'https://fightodds.io/odds/6602/ufc-fight-night-ulberg-vs-reyes'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Chrome and ChromeDriver
      run: |
        # Update package lists
        sudo apt-get update
        
        # Install dependencies
        sudo apt-get install -y wget gnupg
        
        # Add Google's signing key
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        
        # Add Google Chrome repository
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        
        # Update package lists again
        sudo apt-get update
        
        # Install Google Chrome
        sudo apt-get install -y google-chrome-stable
        
        # Verify Chrome installation
        google-chrome --version
        
        # Install ChromeDriver
        CHROME_VERSION=$(google-chrome --version | cut -d " " -f3 | cut -d "." -f1)
        CHROMEDRIVER_VERSION=$(curl -s "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_${CHROME_VERSION}")
        wget -O /tmp/chromedriver.zip "https://chromedriver.storage.googleapis.com/${CHROMEDRIVER_VERSION}/chromedriver_linux64.zip"
        sudo unzip /tmp/chromedriver.zip -d /usr/local/bin/
        sudo chmod +x /usr/local/bin/chromedriver
        
        # Verify ChromeDriver installation
        chromedriver --version
        
    - name: Install Python dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        
    - name: Run scraper
      run: |
        cd backend
        python selenium_scraper_automated.py
        
    - name: Commit and push data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add backend/data/
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update fight data - $(date)"
          git push
        fi