name: Daily UFC Odds Scrape

on:
  schedule:
    - cron: '0 13 * * *'  # 9 AM EST (13:00 UTC)
  workflow_dispatch:
    inputs:
      event_url:
        description: 'UFC Event URL to scrape'
        required: false
        default: 'https://fightodds.io/odds/6602/ufc-fight-night-ulberg-vs-reyes'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Chrome and ChromeDriver
      run: |
        # Update package lists
        sudo apt-get update
        
        # Install dependencies
        sudo apt-get install -y wget gnupg unzip
        
        # Add Google's signing key (using new method)
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome-keyring.gpg
        
        # Add Google Chrome repository
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        
        # Update package lists again
        sudo apt-get update
        
        # Install Google Chrome
        sudo apt-get install -y google-chrome-stable
        
        # Get Chrome version
        CHROME_VERSION=$(google-chrome --version | cut -d " " -f3)
        echo "Chrome version: $CHROME_VERSION"
        
        # Install ChromeDriver using the new Chrome for Testing API
        # For Chrome 115+, use the new versioning API
        CHROME_MAJOR_VERSION=$(echo $CHROME_VERSION | cut -d "." -f1)
        echo "Chrome major version: $CHROME_MAJOR_VERSION"
        
        if [ "$CHROME_MAJOR_VERSION" -ge 115 ]; then
          # Use new Chrome for Testing API for versions 115+
          CHROMEDRIVER_VERSION=$(curl -s "https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_$CHROME_MAJOR_VERSION")
          if [ -z "$CHROMEDRIVER_VERSION" ]; then
            # Fallback to latest stable if specific version not found
            CHROMEDRIVER_VERSION=$(curl -s "https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_STABLE")
          fi
          CHROMEDRIVER_URL="https://storage.googleapis.com/chrome-for-testing-public/${CHROMEDRIVER_VERSION}/linux64/chromedriver-linux64.zip"
        else
          # Use old API for versions < 115
          CHROMEDRIVER_VERSION=$(curl -s "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_${CHROME_MAJOR_VERSION}")
          CHROMEDRIVER_URL="https://chromedriver.storage.googleapis.com/${CHROMEDRIVER_VERSION}/chromedriver_linux64.zip"
        fi
        
        echo "ChromeDriver version: $CHROMEDRIVER_VERSION"
        echo "ChromeDriver URL: $CHROMEDRIVER_URL"
        
        # Download and install ChromeDriver
        wget -O /tmp/chromedriver.zip "$CHROMEDRIVER_URL"
        cd /tmp
        unzip chromedriver.zip
        
        # Move chromedriver to system path
        if [ -f "chromedriver-linux64/chromedriver" ]; then
          # New format (Chrome for Testing)
          sudo mv chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
        else
          # Old format
          sudo mv chromedriver /usr/local/bin/chromedriver
        fi
        
        sudo chmod +x /usr/local/bin/chromedriver
        
        # Verify installations
        google-chrome --version
        chromedriver --version
        
    - name: Install Python dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        
    - name: Run scraper
      run: |
        cd backend
        python selenium_scraper_automated.py
        
    - name: Commit and push data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add backend/data/
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Update fight data - $(date)"
          git push
        fi